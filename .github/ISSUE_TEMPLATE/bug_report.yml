name: Bug report
description: Something does not work as it should.
type: Bug
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please search the open issues first, in case someone has already reported it.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Screenshots and videos are the preferred evidence format.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction on `main`
      description: Steps or a minimal script to reproduce the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and browser
      description: The release version you used, and your browser with its version.
      placeholder: pytycho 0.3.0, Firefox 140
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files (optional)
      description: Drag in any file that helps, e.g. a screenshot, a video, or the page or deck that shows the bug. If GitHub refuses a file as too large, share a link to it instead.
