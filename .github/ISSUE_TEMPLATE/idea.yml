name: Idea
description: A feature or a change that you would like.
type: Feature
body:
  - type: markdown
    attributes:
      value: Thank you for sharing an idea! Please search the open issues first, in case someone has already proposed it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you would like it to work. A sketch or a screenshot helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives (optional)
      description: Other ways to solve the problem that you considered, or how you work around it today.
