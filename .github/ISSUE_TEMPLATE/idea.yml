name: Idea
description: A feature or change that you would like.
type: Feature
body:
  - type: markdown
    attributes:
      value: Thank you for sharing your idea! Please search the open issues first, in case someone has already proposed it.
  - type: textarea
    id: problem
    attributes:
      label: Idea
      description: What you want to achieve, why you cannot achieve it today. Screenshots, videos or simple sketches are helpful.
    validations:
      required: true
  - type: textarea
    id: hard
    attributes:
      label: Hard requirements
      description: The minimum necessary set of changes.
    validations:
      required: true
  - type: textarea
    id: soft
    attributes:
      label: Soft requirements (optional)
      description: Would be nice to have, but not necessary.
    validations:
      required: false
